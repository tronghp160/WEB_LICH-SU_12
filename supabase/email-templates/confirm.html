<!--
  Supabase → Authentication → Emails → Templates → "Confirm sign up".
  Tiêu đề (Subject): Xác nhận email — Lịch sử Việt Nam 12
  Link dùng token_hash (mở được trên trình duyệt khác) → app/auth/confirm/route.ts. `next` = {{ .RedirectTo }}: trang
  muốn quay về sau khi xác nhận (server chỉ nhận URL cùng tên miền — lib/auth/routes.ts, safeNext).
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 520px; margin: 0 auto; color: #1f2937; line-height: 1.6">
  <p style="font-size: 20px; font-weight: bold; margin: 0 0 16px">Lịch sử <span style="color: #b42318">Việt Nam 12</span></p>
  <p>Chào em,</p>
  <p>Em vừa đăng ký tài khoản bằng địa chỉ <strong>{{ .Email }}</strong>. Bấm nút dưới đây để xác nhận email và bắt đầu học:</p>
  <p style="margin: 24px 0">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
      style="background: #b42318; color: #ffffff; padding: 12px 24px; border-radius: 999px; text-decoration: none; font-weight: bold"
      >Xác nhận email</a
    >
  </p>
  <p style="font-size: 14px; color: #6b7280">
    Link chỉ dùng được một lần và hết hạn sau một thời gian ngắn. Nếu em không đăng ký, hãy bỏ qua email này — tài khoản sẽ
    không được kích hoạt.
  </p>
</div>
